<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天云</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 5px;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .progress-container {
            width: 60%;
            max-width: 400px;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
            animation: fadeInProgress 3s ease-in-out;
        }

        @keyframes fadeInProgress {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #fff;
            animation: progressAnimation 10s linear forwards;
        }

        @keyframes progressAnimation {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="logo">天云</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <script>
        // 10秒后跳转到桌面页面
        setTimeout(() => {
            window.location.href = 'desktop.html';
        }, 10000);
    </script>
</body>

</html>
